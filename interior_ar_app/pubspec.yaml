name: ai_assist
description: >
  AI ASSIST — Role-Based Intelligent Accessibility Companion.
  An offline-first Flutter app that adapts its entire UI and feature set
  to a user's accessibility profile (Blind/Low Vision, Non-Speaking,
  Motor-Impaired).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Local storage (offline-first) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^11.0.0

  # --- Camera + OCR (Vision module) ---
  camera: ^0.12.0+2
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_object_detection: ^0.17.1
  google_mlkit_face_detection: ^0.15.1

  # --- Voice: text-to-speech + speech-to-text ---
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # --- Networking (optional cloud AI enhancement) ---
  http: ^1.2.2

  # --- Permissions ---
  permission_handler: ^13.0.1

  # --- Emergency: calling, SMS, location ---
  url_launcher: ^6.3.0
  geolocator: ^14.0.3

  # --- UI / UX ---
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  vibration: ^3.2.1

  # --- Utility ---
  uuid: ^4.4.0
  equatable: ^2.0.5
  intl: ^0.20.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  # fonts:
