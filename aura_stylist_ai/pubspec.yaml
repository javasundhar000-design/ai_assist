name: aura_stylist_ai
description: "AURA STYLIST AI — AI-powered virtual fashion assistant (Flutter UI)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  collection: ^1.18.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  uuid: ^4.4.0
  share_plus: ^11.0.0
  google_mlkit_pose_detection: ^0.14.0
  path_provider: ^2.1.3
  cross_file: ^0.3.4+2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
