name: ai_assist
description: "AI Assist — an accessibility app for blind, non-speaking, and motor-impaired users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase — realtime, multi-device backend
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3      # caregiver accounts (email + password)
  firebase_database: ^11.1.6 # Realtime Database: members, alerts, live sync

  # Networking (OpenRouter)
  http: ^1.6.0

  # Camera / images
  image_picker: ^1.2.3

  # Voice output (Blind Mode + Non-Speaking Mode)
  flutter_tts: ^4.2.0

  # Voice input (Non-Speaking Mode: speak-to-type)
  speech_to_text: ^7.0.0

  # Local, per-device session cache (which family this device joined, notes)
  shared_preferences: ^2.3.3

  # SOS emergency alerts: launches the phone's SMS/dialer app
  url_launcher: ^6.3.1

  # Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
