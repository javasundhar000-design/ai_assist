name: ai_assist
description: "AI Assist — an accessibility-focused AI assistant with role-based access control."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking (used to call OpenRouter directly)
  dio: ^5.4.3+1

  # Secure on-device storage: session id + the user's own OpenRouter key.
  # Never use SharedPreferences for secrets.
  flutter_secure_storage: ^9.2.2

  # Password hashing for the on-device user store
  crypto: ^3.0.3

  # Camera / images
  image_picker: ^1.1.2

  # Text to speech
  flutter_tts: ^4.0.2

  # Local persistence for non-sensitive data (settings, cached history)
  shared_preferences: ^2.2.3

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
