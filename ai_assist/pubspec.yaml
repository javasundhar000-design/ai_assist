name: ai_assist
description: "AI Assist — an accessibility app for blind, non-speaking, and motor-impaired users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.6.0

  # Camera / images
  image_picker: ^1.2.3

  # Voice output (Blind Mode + Non-Speaking Mode)
  flutter_tts: ^4.2.0

  # Voice input (Non-Speaking Mode: speak-to-type, Blind Mode: voice commands)
  speech_to_text: ^7.0.0

  # Local persistence (notes, quick phrases, settings) — no cloud account needed
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
